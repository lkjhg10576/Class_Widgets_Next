name: Build ClassWidgetsNext (Windows)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    # 失败时需把错误日志提交回仓库供公开读取（新仓库默认 token 只读）
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Qt 官方不提供 Linux->Windows 交叉编译，Windows 产物必须在 windows runner 产出
      - name: Install Qt 6.10 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          # Qt5Compat 是独立模块：WidgetsContainer.qml 依赖 Qt5Compat.GraphicalEffects；
          # qtshadertools 是 Qt6Quick 的运行时依赖（windeployqt 会找 Qt6ShaderTools.dll）；
          # qttexttospeech：TTS 真实后端；缺席则构建走 CWN_NO_TTS 桩
          modules: 'qt5compat qtshadertools qttexttospeech'
          cache: true

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-output.log
          exit $LASTEXITCODE

      - name: Install to dist
        # 安装 exe + app/ 运行时资源（src/qml、assets、RinUI、themes、configs）
        run: cmake --install build --prefix dist

      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        run: |
          # windeployqt 靠 VCINSTALLDIR / VCToolsRedistDir / WindowsSdkVerBinPath 定位
          # MSVC 运行库与 dxcompiler.dll / dxil.dll。runner 上这些变量默认不在会话里，
          # 缺了它 windeployqt 只打两行 warning、退出码仍是 0（deploy-output.log 里可见），
          # 于是 dist/ 静默少文件，紧接着 build-installer.ps1 的运行时断言 exit 1。
          # 与本地打包共用同一份实现；必须同一步内完成——GitHub Actions 每个 step 是
          # 独立进程，导出的环境变量不跨 step 生效。
          . ./scripts/msvc-env.ps1
          Initialize-MSVCEnvironment
          windeployqt --release --compiler-runtime --verbose 1 `
            --qmldir app `
            dist/ClassWidgetsNext.exe 2>&1 | Tee-Object -FilePath deploy-output.log
          exit $LASTEXITCODE

      - name: Add offscreen platform plugin (for smoke test)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist\platforms" | Out-Null
          Copy-Item "$env:QT_ROOT_DIR\plugins\platforms\qoffscreen.dll" "dist\platforms\"
          Get-ChildItem "dist\platforms"

      - name: Smoke test (offscreen)
        # CI 冒烟测试：offscreen 平台加载 MainInterface.qml，
        # widgetsLoader 就绪后自动退出；exit 0 = 通过，3 = 超时未就绪
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_LOGGING_RULES = '*.debug=false'
          $p = Start-Process -FilePath "dist\ClassWidgetsNext.exe" `
            -ArgumentList "--smoke-test" -Wait -PassThru
          Write-Host "Smoke test exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Restore pristine default configs
        # ConfigStore::load() 会无条件 save()（见 src/core/ConfigStore.cpp），冒烟测试
        # 运行会把 dist/configs/configs.json 重写为运行期规范化格式 —— 重新 install
        # 恢复仓库原始默认值，保证 zip 与安装器播种的都是出厂默认配置
        run: cmake --install build --prefix dist

      - name: Package (zip)
        shell: pwsh
        run: Compress-Archive -Path "dist\*" -DestinationPath "ClassWidgetsNext-Windows-x64.zip"

      # windows-latest 镜像一般自带 Inno Setup 6（chocolatey 安装），缺失时兜底装一次
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $candidates = @("$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (${env:ProgramFiles(x86)}) {
            $candidates += "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if ((Get-Command iscc -ErrorAction SilentlyContinue) -or
              ($candidates | Where-Object { Test-Path $_ })) {
            Write-Host "Inno Setup 已预装"
          } else {
            Write-Host "Inno Setup 未预装，改用 Chocolatey 安装"
            choco install innosetup -y --no-progress
          }

      # 与本地同一脚本：解析 CWN_VERSION（CMakeLists 缺省值）+ 定位 ISCC + 编译安装器
      - name: Package (Inno Setup installer)
        shell: pwsh
        run: |
          # 整体输出留档到 installer-output.log：运行时依赖断言的排查指引、ISCC 缺失
          # 提示、ISCC 编译报错都只打在控制台（Write-Host / Write-Error），build/deploy
          # 两个日志文件里根本没有 —— 不留档则这类失败在下文的诊断步骤里查无实据。
          # *>&1 才能收进 Write-Host 的信息流；exit 码由 $LASTEXITCODE 透传。
          & scripts/build-installer.ps1 -SkipBuild *>&1 |
            Tee-Object -FilePath installer-output.log
          exit $LASTEXITCODE

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: ClassWidgetsNext-Windows-x64
          path: ClassWidgetsNext-Windows-x64.zip
          if-no-files-found: error

      - name: Upload artifact (installer)
        uses: actions/upload-artifact@v4
        with:
          name: ClassWidgetsNext-Windows-x64-Installer
          path: output/ClassWidgets-*-Win-Installer.exe
          if-no-files-found: error

      # ---- 诊断步骤：必须放在最后，任何前置步骤失败都会触发 ----
      - name: Dump failures to annotations (on failure)
        if: failure()
        shell: pwsh
        run: |
          # 编译/链接错误 + 打包脚本自检失败（缺运行时依赖、找不到 ISCC、ISCC 编译失败）
          $patterns = 'error C\d|fatal error|error LNK|ninja: build stopped|FAILED:|dist 缺少运行时文件|ISCC|未找到 Inno Setup'
          $collected = @()
          foreach ($f in @('build-output.log', 'deploy-output.log', 'installer-output.log')) {
            if (-not (Test-Path $f)) { continue }
            $collected += "== $f =="
            # 连同上下文一起抓：MSVC 的 "see reference to" 行能定位 connect/模板错误源头
            $collected += Select-String -Path $f -Pattern $patterns -Context 1,2 |
              ForEach-Object { $_.Context.PreContext + $_.Line + $_.Context.PostContext }
          }
          $collected | Select-Object -First 40 | ForEach-Object {
            $line = $_
            if ($line -and $line.Length -gt 700) { $line = $line.Substring(0, 700) }
            if ($line) { Write-Host "::error::$line" }
          }

      - name: Commit failure logs (on failure, for public readback)
        if: failure()
        shell: pwsh
        run: |
          $collected = @()
          foreach ($f in @('build-output.log', 'deploy-output.log', 'installer-output.log')) {
            if (Test-Path $f) { $collected += $f }
          }
          if ($collected.Count -eq 0) { Write-Host "no logs"; exit 0 }
          # 全量日志直接提交（仅供诊断，修复后随下一次提交删除）
          $collected | ForEach-Object { Copy-Item $_ "$_.full.txt" }
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git add "$($collected -join '.full.txt ' ).full.txt" 2>$null
          git add *.full.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "nothing new"; exit 0 }
          git commit -m "CI: failure log [skip ci]"
          git pull --rebase origin main
          git push
